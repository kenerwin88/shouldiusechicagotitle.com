<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" role="img" aria-labelledby="title desc">
<title id="title">Three wooden boards clearly inside my property</title>
<desc id="desc">A schematic overhead view. All three boards sit well inside the left-hand parcel labeled My property, separated from the red boundary line and the neighboring parcel by a wide gap. This is an illustration, not a survey.</desc>
<defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V12" stroke="#f9bd1e" stroke-width="2" opacity=".25"/></pattern></defs>
<rect width="680" height="260" fill="#f7f7f3"/>
<text x="25" y="29" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#161616">THE THREE BOARDS WERE ON MY LAND</text>
<rect x="25" y="54" width="399" height="174" fill="#fff5d1" stroke="#161616" stroke-width="2"/>
<rect x="25" y="54" width="399" height="174" fill="url(#hatch)"/>
<rect x="424" y="54" width="231" height="174" fill="#ecece5" stroke="#161616" stroke-width="2"/>
<text x="44" y="83" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#161616">MY PROPERTY</text>
<text x="445" y="83" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#656560">NEIGHBOR’S PROPERTY</text>
<g fill="#f9bd1e" stroke="#161616" stroke-width="2">
<rect x="152" y="114" width="140" height="14"/>
<rect x="152" y="143" width="140" height="14"/>
<rect x="152" y="172" width="140" height="14"/>
</g>
<g stroke="#8b6720" stroke-width="1" fill="none"><path d="M162 121H282M162 150H282M162 179H282"/></g>
<text x="222" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#161616">ALL THREE BOARDS</text>
<path d="M424 50V232" stroke="#d32e12" stroke-width="4"/>
<text x="424" y="249" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#b32610">PROPERTY BOUNDARY</text>
</svg>
