<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" role="img" aria-labelledby="title"><title id="title">Ownership diagram: Fidelity National Financial is the ultimate parent of Chicago Title Insurance Company; Fidelity National Title is also in the FNF family</title><defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V9" stroke="#f9bd1e" stroke-width="3"/></pattern></defs><rect width="680" height="240" fill="#fff8df"/><rect x="122" y="18" width="436" height="64" fill="#161616"/><text x="340" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.3" fill="#f9bd1e">ULTIMATE PARENT</text><text x="340" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="white">Fidelity National Financial (FNF)</text><path d="M340 82V121M170 121H510M170 121V151M510 121V151" stroke="#161616" stroke-width="2" fill="none"/><rect x="33" y="151" width="274" height="59" fill="white" stroke="#161616" stroke-width="2"/><rect x="373" y="151" width="274" height="59" fill="white" stroke="#161616" stroke-width="2"/><path d="M33 151H307M373 151H647" stroke="#f9bd1e" stroke-width="6"/><g text-anchor="middle" font-family="Arial,sans-serif" fill="#161616"><text x="170" y="178" font-weight="bold" font-size="16">Chicago Title</text><text x="170" y="195" font-size="10">Insurance Company</text><text x="510" y="185" font-weight="bold" font-size="16">Fidelity National Title</text><text x="340" y="232" font-size="10" fill="#656560">Simplified family relationship · Intermediate subsidiaries omitted</text></g></svg>